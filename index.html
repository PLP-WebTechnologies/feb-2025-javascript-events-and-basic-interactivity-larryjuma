<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JavaScript Interactivity Demo</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <!-- 1. Event Handling -->
  <section class="eventHandling">
    <h2>1. Event Handling</h2>
    <button id="clickBtn">Click Me</button>

    <div class="hover-box" id="hoverBox">Hover Over Me</div>

    <input type="text" id="keyInput" placeholder="Type something" />

    <div id="secretAction" style="margin-top:20px; background:#eee; padding:10px; width:200px;" ondblclick="alert('Double-click detected!')">
      Double-click or long-press here 
    </div>
    <hr>
  </section>

  <!-- 2. Interactive Elements -->
  <section class="interactiveElement" >
    <h2>2. Interactive Elements</h2>

    <button id="colorBtn">Change My Color</button>

    <div class="gallery" id="gallery">
      <img src="Images/bmw.jfif" alt="Image 1" />
      <img src="Images/ducati.jfif"Image 2" />
      <img src="Images/ninja H2R.jfif" alt="Image 3" />
    </div>

    <div class="tabs">
      <button onclick="showTab('tab1')">Tab 1</button>
      <button onclick="showTab('tab2')">Tab 2</button>

      <div id="tab1" class="tab-content">This is Tab 1 content.</div>
      <div id="tab2" class="tab-content">This is Tab 2 content.</div>
    </div>
    <hr>
  </section>

  <!-- 3. Form Validation -->
  <section class="formValidation">
    <h2>3. Form Validation</h2>
    <form id="myForm">
      <label>
        Email:
        <input type="email" id="email" required />
      </label><br/><br/>
      <label>
        Password:
        <input type="password" id="password" required minlength="8"/>
      </label><br/><br/>
      <button type="submit">Submit</button>
      <div id="feedback"></div>
    </form>
  </section>


  <script src="script.js"></script>
</body>
</html>
